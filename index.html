<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2C5364" />
  <title>祁连说工作室管理系统</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/logo.svg" />
  <link rel="apple-touch-icon" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/logo.svg" alt="logo" class="brand-logo" />
        <div class="brand-text">
          <strong>祁连说</strong>
          <span>工作室管理系统</span>
        </div>
      </div>
      <nav class="nav" id="nav"><!-- 由 app.js 注入 --></nav>
      <div class="sidebar-foot">
        <div class="sync-state" id="syncState" title="IMA 同步状态">未连接 IMA</div>
      </div>
    </aside>

    <!-- 主区 -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">☰</button>
        <h1 class="page-title" id="pageTitle">工作台</h1>
        <div class="topbar-actions">
          <div class="search-box">
            <input id="globalSearch" type="search" placeholder="搜索…" />
          </div>
          <button class="btn btn-ghost" id="imaSyncBtn">↻ 同步 IMA</button>
          <button class="btn btn-primary" id="quickCreateBtn">＋ 新建</button>
        </div>
      </header>
      <main class="content" id="content"><!-- 模块渲染区 --></main>
    </div>

    <div class="scrim" id="scrim"></div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ima.js"></script>
  <script src="js/push.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
